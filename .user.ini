; .user.ini — Límites de PHP para este portal (PHP lo lee en FastCGI/CGI,
; que es como corre con mod_fcgid). NO usar php_value en .htaccess: con
; mod_fcgid provoca un error 500.
; PHP relee este archivo cada 5 minutos (user_ini.cache_ttl): tras cambiarlo,
; espera o reinicia Apache.
; Deben ser coherentes con MAX_MB de config.php y con FcgidMaxRequestLen
; de httpd.conf (ver docs/instalacion.md).
upload_max_filesize = 200M
post_max_size = 210M
max_execution_time = 600
max_input_time = 600
memory_limit = 256M
